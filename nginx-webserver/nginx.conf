upstream service1 {
    server service1:8199;
}

upstream rest-api {
    server rest-api:8000;
}

server {
    listen 8198;
    
    include /etc/nginx/mime.types;
    root /usr/data;
    index index.html;

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }

    location /api/service1 {
        proxy_pass http://service1;
    }

}

server {
    listen 8197;

    location /state {
        proxy_pass http://rest-api/state;
    }

    location /state-log {
        proxy_pass http://rest-api/state-log;
    }

    location /request {
        proxy_pass http://rest-api/request;
    }

}