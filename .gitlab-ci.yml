# Set up the Docker image and services for GitLab CI/CD
default:
  # Use the latest version of Docker
  image: docker:27.5.1
  # Use the Docker-in-Docker service for GitLab CI/CD
  services:
    - docker:27.5.1-dind
  # Check the Docker version
  before_script:
    - docker info

# Telling Docker where to create the certificates Docker creates on boot
variables:
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - build
  - test
  - deploy

job_build:
  stage: build
  script:
    - echo "Building the project"
    - docker compose -f docker-compose.yml build

job_test:
  stage: test
  script:
    - echo "Running tests"
    # Run the tests in the Docker container
    # Use the -d flag to run the containers in the background
    # so that the terminal is not blocked by containers running in the foreground
    - docker compose -f docker-compose.yml up -d
    # Add permissions to the test file
    - chmod +x ./tests/test.sh
    # Execute the test script
    - ./tests/test.sh
    # Stop the containers
    - docker compose -f docker-compose.yml down

job_deploy:
  stage: deploy
  script:
    - echo "Deploying the project"
    - docker compose up -d